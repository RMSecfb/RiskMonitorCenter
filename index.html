<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>風險管理中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：一間深色監控室，正面大螢幕分債／股／匯三區，四張辦公桌代表四大業務；介面元件像控制台的儀表面板疊在場景上 */
:root{
  --ink:#070b12;        /* 房間底色 */
  --panel:#0e1623;      /* 面板 */
  --panel-2:#131d2d;
  --line:#223049;
  --text:#dce4ef;
  --muted:#8494ab;
  --gold:#c9a44c;       /* 品牌金 */
  --cyan:#5fc6dd;       /* 資料光 */
  --ok:#3fbf80;
  --l1:#e9a23b;
  --l2:#e5544c;
  --na:#5b6679;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-label:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;}
[hidden]{display:none!important;}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink);}
button{font:inherit;color:inherit;}
a{color:var(--cyan);}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;}
.lab{font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;}

/* 場景 */
#stage{position:fixed;inset:0;}
#stage canvas{display:block;}
.layer{position:absolute;inset:0;pointer-events:none;}

/* 頂部列 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--ink),rgba(7,11,18,.0));}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0;}
.brand b{font-size:17px;font-weight:700;letter-spacing:.06em;}
.brand span{font-family:var(--f-label);font-size:12px;color:var(--gold);letter-spacing:.18em;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap;}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--na);}
.chip.live i{background:var(--ok);}
.chip.snap i{background:var(--gold);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--gold);}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;}
.btn:hover{border-color:var(--gold);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120a;font-weight:500;}

/* 圖例 */
.legend{position:fixed;z-index:30;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;flex-wrap:wrap;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(14,22,35,.85);font-size:12px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--na);flex:none;}
.dot.ok{background:var(--ok);} .dot.l1{background:var(--l1);} .dot.l2{background:var(--l2);}
.dot.nt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted);}
.dot.ok,.dot.l1,.dot.l2{box-shadow:0 0 8px currentColor;}
.dot.ok{color:var(--ok);} .dot.l1{color:var(--l1);} .dot.l2{color:var(--l2);}
.hint{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);}

/* 大螢幕（CSS3D） */
.screen{width:1640px;height:600px;box-sizing:border-box;padding:26px 30px;background:rgba(6,12,22,.92);border:2px solid #2a3a55;
  box-shadow:0 0 60px rgba(95,198,221,.18),inset 0 0 80px rgba(95,198,221,.06);color:var(--text);font-family:var(--f-body);pointer-events:auto;}
.screen-head{display:flex;align-items:baseline;gap:18px;margin-bottom:18px;}
.screen-head .lab{font-size:34px;color:var(--gold);}
.screen-head .meta{font-size:22px;color:var(--muted);}
.screen-head .meta b{color:var(--text);font-weight:500;}
.screen-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.scol{border:1px solid #22324c;background:rgba(14,22,35,.75);padding:16px 18px;cursor:pointer;transition:border-color .2s;}
.scol:hover{border-color:var(--gold);}
.scol-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.scol-head h3{margin:0;font-size:36px;font-weight:700;letter-spacing:.08em;}
.scol-head .lab{font-size:22px;color:var(--muted);}
.pill{margin-left:auto;font-size:20px;padding:3px 12px;border-radius:999px;border:1px solid currentColor;}
.pill.ok{color:var(--ok);} .pill.l1{color:var(--l1);} .pill.l2{color:var(--l2);} .pill.na{color:var(--na);} .pill.nt{color:var(--muted);}
.srow{display:grid;grid-template-columns:18px 1fr auto 110px;align-items:center;gap:10px;padding:4px 0;border-top:1px solid rgba(34,48,73,.6);font-size:24px;}
.srow .v{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;}
.srow .c{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:20px;color:var(--muted);}
.srow.pending{color:var(--na);}
.up{color:#e58a7a;} .down{color:#7fc7a0;}

/* 辦公桌標籤（CSS2D） */
.desk-label{pointer-events:auto;cursor:pointer;min-width:150px;padding:8px 12px 9px;background:rgba(10,16,27,.88);border:1px solid var(--line);
  border-radius:8px;text-align:left;transition:border-color .2s,transform .2s;font-family:var(--f-body);}
.desk-label:hover,.desk-label.hot{border-color:var(--gold);transform:translateY(-3px);}
.desk-label b{display:block;font-size:15px;letter-spacing:.04em;}
.desk-label .lab{display:block;font-size:11px;color:var(--gold);}
.desk-label .meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--muted);}

/* 側邊面板 */
.drawer{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(440px,100%);box-sizing:border-box;background:var(--panel);border-left:1px solid var(--line);
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));overflow-y:auto;transform:translateX(100%);transition:transform .28s ease;}
.drawer.open{transform:none;}
.drawer header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.drawer h2{margin:0;font-size:22px;text-wrap:balance;}
.drawer header .lab{display:block;font-size:12px;color:var(--gold);margin-bottom:2px;}
.drawer .x{margin-left:auto;}
.drawer p.desc{color:var(--muted);line-height:1.7;margin:0 0 16px;}
.tools{display:grid;gap:12px;}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:14px;display:grid;gap:8px;}
.tool h3{margin:0;font-size:16px;}
.tool p{margin:0;color:var(--muted);line-height:1.6;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
.tag.warn{border-color:rgba(233,162,59,.5);color:var(--l1);}
.notice{font-size:12px;color:var(--l1);}
.tool .open{justify-self:start;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--gold);padding:6px 12px;border-radius:7px;font-weight:500;}
.rules{width:100%;border-collapse:collapse;font-size:13px;}
.rules th,.rules td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top;}
.rules th{color:var(--muted);font-weight:400;}
.rules td.n{white-space:nowrap;}

/* 今日報告 */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(3,6,10,.72);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;}
.report{width:min(720px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;}
.report .lab{font-size:13px;color:var(--gold);}
.report h2{margin:4px 0 16px;font-size:24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;}
.report h2 .sub{font-size:16px;font-weight:400;color:var(--muted);}
.rcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.rcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel-2);display:grid;gap:6px;}
.rcard .t{display:flex;align-items:center;gap:8px;font-weight:500;}
.rcard .t .pill{font-size:12px;padding:1px 8px;}
.rcard small{color:var(--muted);}
.report h3{font-size:15px;margin:18px 0 8px;}
.near{margin:0;padding:0;list-style:none;display:grid;gap:6px;}
.near li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.bar{flex:1 1 120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center;}
.bar i{display:block;height:100%;background:var(--l1);}
.bar.l2 i{background:var(--l2);}
.report h3 + .near{margin-top:0;}
.empty{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);line-height:1.7;}
.news-meta{margin:0 0 8px;font-size:12px;color:var(--muted);}
.news{margin:0;padding:0;list-style:none;display:grid;gap:10px;}
.news li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);display:grid;gap:4px;}
.news .nh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.news p{margin:0;color:var(--muted);line-height:1.6;}
.news .ns{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;}
.news .ns a{text-decoration:none;}
.report .notice{margin-bottom:8px;}
.report footer{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;}

/* 清單模式 */
.listview{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--ink);
  padding-block:calc(80px + env(safe-area-inset-top,0px)) calc(70px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.lv-inner{max-width:1180px;margin:0 auto;display:grid;gap:28px;}
.lv-inner h2{margin:0 0 10px;font-size:18px;letter-spacing:.06em;}
.mk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.mcol{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;min-width:0;cursor:pointer;}
.mcol .scol-head h3{font-size:18px;} .mcol .scol-head .lab{font-size:13px;} .mcol .pill{font-size:12px;padding:1px 9px;}
.mcol .srow{font-size:13px;grid-template-columns:12px 1fr auto 70px;}
.mcol .srow .c{font-size:12px;}
.doms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.dom{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;min-width:0;}
.dom h3{margin:0;font-size:17px;} .dom .lab{font-size:12px;color:var(--gold);}
.dom .tools{margin-top:12px;}

@media (max-width:820px){
  .mk,.doms,.rcards{grid-template-columns:1fr;}
  .hint{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div id="stage" aria-label="監控室 3D 場景"></div>

<div class="topbar">
  <div class="brand"><b>風險管理中心</b><span>RISK INTELLIGENCE CENTER</span></div>
  <span class="chip" id="dataChip"><i></i><span id="dataText">讀取市場資料中</span></span>
  <div class="seg" role="group" aria-label="檢視方式" id="viewSeg">
    <button id="btnRoom" aria-pressed="true">監控室</button>
    <button id="btnList" aria-pressed="false">清單</button>
  </div>
  <button class="btn" id="btnReset">重置視角</button>
  <button class="btn gold" id="btnReport">今日報告</button>
</div>

<div class="legend" aria-label="燈號說明">
  <span><i class="dot ok"></i>正常</span><span><i class="dot l1"></i>L1</span><span><i class="dot l2"></i>L2</span><span><i class="dot nt"></i>未設門檻</span><span><i class="dot"></i>待串接</span>
</div>
<div class="hint">拖曳旋轉・滾輪縮放・點辦公桌開啟工具</div>

<section class="listview" id="listview" hidden>
  <div class="lv-inner">
    <div><h2>全球市場</h2><div class="mk" id="lvMarkets"></div></div>
    <div><h2>業務領域與工具</h2><div class="doms" id="lvDomains"></div></div>
  </div>
</section>

<aside class="drawer" id="drawer" aria-hidden="true" tabindex="-1"></aside>

<div class="modal" id="modal" hidden>
  <div class="report" role="dialog" aria-modal="true" aria-labelledby="reportTitle" id="report"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="app.js"></script>
</body>
</html>
