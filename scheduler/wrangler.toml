# 風險管理排程觸發器。用 Cloudflare 後台貼上程式時，以下 crons 需在後台 Settings → Trigger events 手動新增。
name = "risk-scheduler"
main = "worker.js"
compatibility_date = "2024-09-23"

[triggers]
# UTC；星期用英文縮寫（Cloudflare 的數字 1 代表週日）
crons = ["7,37 22 * * MON-FRI", "7,17 23 * * *", "22 0 * * *"]

[observability]
enabled = true
